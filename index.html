<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>somewhereoutsidethewindow</title>
<link rel="stylesheet" href="css/main.css">
<style>
  html { background:#000; }
  body { overflow:hidden; background:transparent !important; }

  #bgPhoto {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center center;
    z-index:-1;
    filter:brightness(0.5) saturate(0.85);
  }

  #bgOverlay {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.38);
    z-index:0;
    pointer-events:none;
  }

  #surface {
    position:fixed; top:0; left:0;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:2;
  }

  #titleWrap { cursor:pointer; padding:20px; }
  #titleWrap img {
    width:min(70vw, 600px);
    display:block;
    mix-blend-mode:screen;
    transition:filter 0.4s ease;
  }
  #titleWrap:hover img {
    filter:drop-shadow(0 0 18px rgba(255,255,255,0.3));
  }
</style>
</head>
<body>
  <img id="bgPhoto" src="images/bg.jpg" alt="">
  <div id="bgOverlay"></div>
  <div id="surface">
    <div id="titleWrap" onclick="goToHub()">
      <img src="images/title.png" alt="somewhereoutsidethewindow">
    </div>
  </div>

<script>
  function goToHub(){
    try {
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const buf = ctx.createBuffer(1,1,22050);
      const src = ctx.createBufferSource();
      src.buffer=buf; src.connect(ctx.destination); src.start(0);
    } catch(e){}
    window.location.href = 'hub.html?audio=1';
  }
</script>
</body>
</html>
