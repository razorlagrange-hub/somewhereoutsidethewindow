<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }
  #c { display:block; width:100vw; height:100vh; }
  #ui {
    position:fixed; bottom:4%; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.3); font-size:9px; letter-spacing:0.2em;
    text-transform:uppercase; pointer-events:none; text-align:center;
    transition:opacity 1s;
  }
  #ui.hidden { opacity:0; }
  #keys {
    position:fixed; bottom:2%; left:50%; transform:translateX(-50%);
    pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    transition:opacity 1s;
  }
  #keys.hidden { opacity:0; }
  .key-row { display:flex; gap:3px; }
  .key {
    width:22px; height:22px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:3px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:rgba(255,255,255,0.4);
    font-family:'Courier New',monospace;
  }
  #crosshair {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:12px; height:12px;
    pointer-events:none;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:rgba(255,255,255,0.3);
  }
  #crosshair::before { width:1px; height:100%; left:50%; top:0; }
  #crosshair::after  { width:100%; height:1px; top:50%; left:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair"></div>
<div id="ui">click to explore &nbsp;·&nbsp; arrow keys to move &nbsp;·&nbsp; mouse to look</div>
<div id="keys">
  <div class="key-row"><div class="key">↑</div></div>
  <div class="key-row"><div class="key">←</div><div class="key">↓</div><div class="key">→</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const W = window.innerWidth, H = window.innerHeight;
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0c);
  scene.fog = new THREE.Fog(0x0a0a0c, 18, 45);

  const camera = new THREE.PerspectiveCamera(72, W/H, 0.1, 100);
  camera.position.set(0, 1.65, 8);

  // =============================================
  //  MATERIALS
  // =============================================

  // Marble floor — procedural via canvas texture
  function makeMarbleTexture(size=512){
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const cx = cv.getContext('2d');
    // base — cold white grey
    cx.fillStyle = '#d8d8dc';
    cx.fillRect(0,0,size,size);
    // veins
    for(let i=0;i<18;i++){
      cx.beginPath();
      const x0=Math.random()*size, y0=Math.random()*size;
      cx.moveTo(x0,y0);
      for(let j=0;j<8;j++){
        cx.bezierCurveTo(
          x0+(Math.random()-0.5)*size*0.6, y0+(Math.random()-0.5)*size*0.6,
          x0+(Math.random()-0.5)*size*0.6, y0+(Math.random()-0.5)*size*0.6,
          x0+(Math.random()-0.5)*size*0.4, y0+(Math.random()-0.5)*size*0.4
        );
      }
      const alpha = 0.04 + Math.random()*0.08;
      const grey = Math.floor(160+Math.random()*40);
      cx.strokeStyle = `rgba(${grey},${grey},${grey+10},${alpha})`;
      cx.lineWidth = 0.5 + Math.random()*2;
      cx.stroke();
    }
    // subtle tonal variation
    for(let y=0;y<size;y+=4){
      const v = (Math.sin(y/30)*3)|0;
      cx.fillStyle=`rgba(${180+v},${180+v},${185+v},0.04)`;
      cx.fillRect(0,y,size,4);
    }
    return new THREE.CanvasTexture(cv);
  }

  const marbleTex = makeMarbleTexture(512);
  marbleTex.wrapS = marbleTex.wrapT = THREE.RepeatWrapping;
  marbleTex.repeat.set(6,6);

  const floorMat = new THREE.MeshStandardMaterial({
    map: marbleTex,
    roughness: 0.12,
    metalness: 0.05,
    color: 0xd0d0d8,
  });

  const wallMat = new THREE.MeshStandardMaterial({
    color: 0xe8e8ec,
    roughness: 0.85,
    metalness: 0.0,
  });

  const ceilMat = new THREE.MeshStandardMaterial({
    color: 0xf0f0f2,
    roughness: 0.95,
  });

  const moldingMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.5,
  });

  // =============================================
  //  ROOM GEOMETRY
  //  Large single hall: 24 x 7 x 12
  // =============================================
  const RW=24, RH=7, RD=12;

  // Floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(RW,RD), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Ceiling
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(RW,RD), ceilMat);
  ceil.rotation.x = Math.PI/2;
  ceil.position.y = RH;
  scene.add(ceil);

  // Walls
  function addWall(w,h,x,y,z,ry){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat.clone());
    m.position.set(x,y,z);
    m.rotation.y = ry;
    m.receiveShadow = true;
    scene.add(m);
  }
  // back wall
  addWall(RW,RH, 0,RH/2,-RD/2, 0);
  // front wall
  addWall(RW,RH, 0,RH/2, RD/2, Math.PI);
  // left wall
  addWall(RD,RH,-RW/2,RH/2,0, Math.PI/2);
  // right wall
  addWall(RD,RH, RW/2,RH/2,0,-Math.PI/2);

  // Baseboard molding
  function addMolding(w,x,z,ry){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,0.12,0.06), moldingMat);
    m.position.set(x,0.06,z);
    m.rotation.y = ry;
    scene.add(m);
  }
  addMolding(RW, 0,     -RD/2+0.03, 0);
  addMolding(RW, 0,      RD/2-0.03, 0);
  addMolding(RD,-RW/2+0.03, 0, Math.PI/2);
  addMolding(RD, RW/2-0.03, 0, Math.PI/2);

  // Crown molding at ceiling
  function addCrown(w,x,y,z,ry){
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,0.1,0.08), moldingMat);
    m.position.set(x,y,z);m.rotation.y=ry;scene.add(m);
  }
  addCrown(RW,0,RH-0.05,-RD/2+0.04,0);
  addCrown(RW,0,RH-0.05, RD/2-0.04,0);
  addCrown(RD,-RW/2+0.04,RH-0.05,0,Math.PI/2);
  addCrown(RD, RW/2-0.04,RH-0.05,0,Math.PI/2);

  // =============================================
  //  PICTURE FRAMES — empty, waiting
  // =============================================
  const frameMat = new THREE.MeshStandardMaterial({ color:0x1a1a18, roughness:0.4, metalness:0.1 });
  const matMat   = new THREE.MeshStandardMaterial({ color:0xf5f3ee, roughness:0.95 });
  const emptyMat = new THREE.MeshStandardMaterial({ color:0x111110, roughness:0.9 });

  function addFrame(x, y, z, ry, fw=1.4, fh=1.1){
    const g = new THREE.Group();
    // frame border
    const outer = new THREE.Mesh(new THREE.BoxGeometry(fw+0.12, fh+0.12, 0.06), frameMat);
    outer.castShadow = true;
    g.add(outer);
    // mat
    const mat_ = new THREE.Mesh(new THREE.BoxGeometry(fw+0.04, fh+0.04, 0.05), matMat);
    mat_.position.z = 0.01;
    g.add(mat_);
    // empty canvas
    const canvas_ = new THREE.Mesh(new THREE.BoxGeometry(fw-0.1, fh-0.1, 0.02), emptyMat);
    canvas_.position.z = 0.04;
    g.add(canvas_);
    // small plaque below
    const plaqueMat = new THREE.MeshStandardMaterial({color:0xb8a870, roughness:0.3, metalness:0.4});
    const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.06, 0.02), plaqueMat);
    plaque.position.set(0, -fh/2-0.12, 0.02);
    g.add(plaque);

    g.position.set(x, y, z);
    g.rotation.y = ry;
    scene.add(g);
  }

  // Back wall frames
  addFrame(-7.5, 3.2, -RD/2+0.06, 0, 1.6, 1.2);
  addFrame(-3.5, 3.2, -RD/2+0.06, 0, 1.2, 1.5);
  addFrame( 0.0, 3.2, -RD/2+0.06, 0, 2.0, 1.4);
  addFrame( 3.8, 3.2, -RD/2+0.06, 0, 1.2, 1.8);
  addFrame( 7.5, 3.2, -RD/2+0.06, 0, 1.6, 1.2);

  // Left wall
  addFrame(-RW/2+0.06, 3.2, -2.5, Math.PI/2, 1.8, 1.3);
  addFrame(-RW/2+0.06, 3.2,  2.5, Math.PI/2, 1.4, 1.6);

  // Right wall
  addFrame( RW/2-0.06, 3.2, -2.5,-Math.PI/2, 1.8, 1.3);
  addFrame( RW/2-0.06, 3.2,  2.5,-Math.PI/2, 1.4, 1.6);

  // =============================================
  //  LIGHTING
  // =============================================

  // Ambient — very cold, low
  scene.add(new THREE.AmbientLight(0xc8d0e8, 0.3));

  // Ceiling spotlights — cold halogen
  function addSpot(x, y, z, intensity=1.2){
    const s = new THREE.SpotLight(0xd8e0f0, intensity, 14, Math.PI/5, 0.4, 1.5);
    s.position.set(x,y,z);
    s.target.position.set(x, 0, z);
    s.castShadow = true;
    s.shadow.mapSize.set(512,512);
    scene.add(s);
    scene.add(s.target);
    // visible bulb
    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.04,8,8),
      new THREE.MeshBasicMaterial({color:0xd8e0f0})
    );
    bulb.position.set(x,y-0.05,z);
    scene.add(bulb);
  }

  // Row of spots along ceiling
  for(let x=-9; x<=9; x+=4.5){
    addSpot(x, RH-0.15, -1, 1.0);
    addSpot(x, RH-0.15,  1, 1.0);
  }

  // Picture lights — warm accent on frames
  const picLightMat = new THREE.MeshBasicMaterial({color:0xffeecc});
  function addPicLight(x,y,z,ry){
    const s = new THREE.SpotLight(0xfff0d8, 0.8, 5, Math.PI/8, 0.6, 2);
    s.position.set(x,y,z);
    const tx = x + Math.sin(ry)*0.5;
    const tz = z + Math.cos(ry)*0.5;
    s.target.position.set(tx, y-1.2, tz);
    scene.add(s);scene.add(s.target);
  }
  addPicLight(-7.5,4.6,-RD/2+0.3,0);
  addPicLight(-3.5,4.6,-RD/2+0.3,0);
  addPicLight( 0.0,4.6,-RD/2+0.3,0);
  addPicLight( 3.8,4.6,-RD/2+0.3,0);
  addPicLight( 7.5,4.6,-RD/2+0.3,0);

  // =============================================
  //  POINTER LOCK + MOVEMENT
  // =============================================
  const keys = {};
  document.addEventListener('keydown', e=>{ keys[e.code]=true; e.preventDefault(); });
  document.addEventListener('keyup',   e=>keys[e.code]=false);

  let yaw=0, pitch=0, locked=false;
  const euler = new THREE.Euler(0,0,0,'YXZ');

  document.getElementById('c').addEventListener('click',()=>{
    document.getElementById('c').requestPointerLock();
  });

  document.addEventListener('pointerlockchange',()=>{
    locked = document.pointerLockElement === document.getElementById('c');
    document.getElementById('ui').classList.toggle('hidden', locked);
    document.getElementById('keys').classList.toggle('hidden', locked);
  });

  document.addEventListener('mousemove', e=>{
    if(!locked) return;
    yaw   -= e.movementX * 0.0008;
    pitch -= e.movementY * 0.0008;
    pitch  = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch));
  });

  const vel = new THREE.Vector3();
  const dir = new THREE.Vector3();

  function move(dt){
    const speed = 4.5;
    const fwd  = keys['ArrowUp'];
    const back = keys['ArrowDown'];
    const left = keys['ArrowLeft'];
    const right= keys['ArrowRight'];

    euler.set(pitch, yaw, 0);
    camera.quaternion.setFromEuler(euler);

    const fwdVec = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    fwdVec.y = 0; fwdVec.normalize();
    const rightVec = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    rightVec.y = 0; rightVec.normalize();

    vel.set(0,0,0);
    if(fwd)  vel.addScaledVector(fwdVec,   speed*dt);
    if(back) vel.addScaledVector(fwdVec,  -speed*dt);
    if(right) vel.addScaledVector(rightVec, speed*dt);
    if(left)  vel.addScaledVector(rightVec,-speed*dt);

    camera.position.add(vel);
    camera.position.x = Math.max(-RW/2+0.5, Math.min(RW/2-0.5, camera.position.x));
    camera.position.z = Math.max(-RD/2+0.5, Math.min(RD/2-0.5, camera.position.z));
    camera.position.y = 1.65;
  }

  // =============================================
  //  LOOP
  // =============================================
  let last = performance.now();
  function loop(){
    requestAnimationFrame(loop);
    const now = performance.now();
    const dt = Math.min((now-last)/1000, 0.05);
    last = now;
    move(dt);
    renderer.render(scene, camera);
  }
  loop();

  window.addEventListener('resize',()=>{
    const w=window.innerWidth, h=window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  });
})();
</script>
</body>
</html>
