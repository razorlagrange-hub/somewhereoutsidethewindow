<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>somewhereoutsidethewindow — hub</title>
<link rel="stylesheet" href="css/main.css">
<style>
  #ui { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; opacity:0; transition:opacity 2.8s ease; }
  #ui.visible { opacity:1; }
  #c { opacity:0; transition:opacity 2.4s ease; }
  #c.visible { opacity:1; }
  #svgWrap { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:170px; cursor:pointer; z-index:10; opacity:0; transition:opacity 1.6s ease; }
  #svgWrap.visible { opacity:1; }
  #dialogBox { position:fixed; bottom:8%; left:50%; transform:translateX(-50%); width:88%; max-width:520px; background:#0a0908; border:2px solid #4a4a4a; border-radius:2px; padding:16px 18px; opacity:0; pointer-events:none; z-index:20; box-shadow:0 0 0 1px #1a1a1a,0 4px 20px rgba(0,0,0,.6); transition:opacity .4s; }
  #dialogText { color:#e8e0d0; font-family:'Courier New',monospace; font-size:13px; line-height:1.6; letter-spacing:.02em; white-space:pre-wrap; min-height:21px; }
  .lk { position:absolute; pointer-events:all; cursor:pointer; font-family:'Courier New',monospace; letter-spacing:.18em; user-select:none; color:#fff; }
</style>
</head>
<body>
<div class="fade-cover" id="fadeIn"></div>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="svgWrap">
  <div id="intercom-wrap" style="position:relative;width:170px;">
    <img id="intercom-img" src="images/intercom.png" style="width:100%;display:block;" alt="intercom">
    <!-- LED overlay — green dot that lights up when speaking -->
    <div id="led-overlay" style="
      position:absolute;
      width:12px;height:12px;
      border-radius:50%;
      background:radial-gradient(circle at 40% 35%, #88ff88, #00aa00);
      box-shadow:0 0 6px #00ff00;
      left:32%;top:82%;
      opacity:0.2;
      transition:opacity 0.1s;
      pointer-events:none;
    "></div>
  </div>
</div>
<div id="dialogBox"><div id="dialogText"></div></div>

<script>
(function(){
  const cv      = document.getElementById('c');
  const cx      = cv.getContext('2d');
  const ui      = document.getElementById('ui');
  const svgWrap = document.getElementById('svgWrap');
  const dialogBox = document.getElementById('dialogBox');
  const dialogText= document.getElementById('dialogText');
  const fadeIn    = document.getElementById('fadeIn');

  let W=0, H=0, t=0;

  // =============================================
  //  ENTRANCE SEQUENCE
  //  1. fade from black
  //  2. intercom appears
  //  3. intercom speaks
  //  4. hub (background + links) fade in
  // =============================================
  setTimeout(()=> fadeIn.classList.add('done'), 100);
  setTimeout(()=> svgWrap.classList.add('visible'), 600);
  setTimeout(()=> typeLine(LINES[0]), 1400);
  setTimeout(()=>{ cv.classList.add('visible'); ui.classList.add('visible'); }, 2200);

  // =============================================
  //  INTERCOM LINES
  // =============================================
  const LINES = [
    "Welcome to the Hub. I'll appear throughout your visit to provide additional information whenever necessary.",
    "Navigate using the links around me. Some are not yet available.",
    "This is the main hub. All sections connect from here.",
    "Some sections are still under construction.",
    "Return here at any time.",
    "I am always available if you need direction.",
    "The parking section is to the right.",
    "Not all links lead where you expect.",
    "Take your time looking around.",
  ];

  let lineIndex = 0;
  function nextLine(){
    lineIndex = (lineIndex + 1) % LINES.length;
    return LINES[lineIndex];
  }

  // =============================================
  //  AUDIO
  // =============================================
  let audioCtx = null;
  function initAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  // auto-init if coming from index with ?audio=1
  if(new URLSearchParams(window.location.search).get('audio')==='1'){
    try{ initAudio(); } catch(e){}
  }

  function playBlip(i){
    if(!audioCtx) return;
    const freq = 130+((i*37)%9)*14;
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.045, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.045);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+0.05);
  }

  let typing=false, hideTimer=null;
  function typeLine(line){
    isSpeaking = true;
    initAudio();
    typing = true;
    if(hideTimer) clearTimeout(hideTimer);
    dialogBox.style.opacity = '1';
    dialogText.textContent  = '';
    let i=0;
    function step(){
      if(i<line.length){
        const ch = line[i];
        dialogText.textContent += ch;
        if(ch!==' ') playBlip(i);
        i++;
        setTimeout(step, 28+Math.random()*14);
      } else {
        typing = false;
        const readTime = Math.max(1500, line.length*22);
        hideTimer = setTimeout(()=>{ dialogBox.style.opacity='0'; isSpeaking = false; }, readTime);
      }
    }
    step();
  }

  // =============================================
  //  5 LINKS around intercom
  // =============================================
  const LINKS = [
    { label:'chairs',         href:'chairs/index.html', angle:-Math.PI/2 }, // top
    { label:'parking',        href:'parking/park_page1.html', angle:0 },           // right — LIVE
    { label:'coming soon...', href:'#', angle:Math.PI/2 },    // bottom
    { label:'coming soon...', href:'#', angle:Math.PI },      // left
    { label:'???',            href:'#', angle:-Math.PI/4 },   // top-right offset
  ];

  const links = [];
  function initLinks(){
    ui.querySelectorAll('.lk').forEach(e=>e.remove());
    links.length = 0;
    LINKS.forEach((link,i)=>{
      const el = document.createElement('span');
      el.className = 'lk';
      el.textContent = link.label;
      el.style.fontSize      = '9px';
      el.style.color         = '#ccc';
      el.style.letterSpacing = '0.12em';
      el.style.cursor        = link.href==='#'?'default':'pointer';
      if(link.href!=='#') el.addEventListener('click',()=>{ window.location.href=link.href; });
      ui.appendChild(el);
      links.push({ el, baseAngle:link.angle, phase:i*Math.PI*0.5 });
    });
  }

  function updateLinks(){
    const cxW=W/2, cyH=H/2;
    const R = Math.min(W,H)*0.36;
    links.forEach((l,i)=>{
      const wobble = Math.sin(t*0.25+l.phase)*0.018;
      const a = l.baseAngle+wobble;
      const r = R+Math.sin(t*0.18+l.phase)*6;
      const x = cxW+Math.cos(a)*r;
      const y = cyH+Math.sin(a)*r;
      l.el.style.left      = x+'px';
      l.el.style.top       = y+'px';
      l.el.style.transform = 'translate(-50%,-50%)';
      l.el.style.opacity   = 0.3+Math.abs(Math.sin(t*0.2+l.phase))*0.2;
    });
  }

  // =============================================
  //  INTERCOM ANIMATION — image based
  // =============================================
  const intercomImg = document.getElementById('intercom-img');
  const ledOverlay = document.getElementById('led-overlay');
  const intercomWrap = document.getElementById('intercom-wrap');
  let isSpeaking = false;

  function updatePhone(){
    // subtle idle float
    const tx = Math.sin(t*0.8)*1.2;
    const ty = Math.cos(t*0.6)*0.8;
    svgWrap.style.transform = `translate(calc(-50% + ${tx}px), calc(-60% + ${ty}px))`;

    // subtle speaking animation — rhythmic micro-oscillation
    if(isSpeaking){
      const vy = Math.sin(t*14)*0.35;
      const vx = Math.sin(t*17)*0.15;
      intercomImg.style.transform = `translate(${vx}px,${vy}px)`;
      const ledPulse = 0.6 + Math.abs(Math.sin(t*12))*0.4;
      ledOverlay.style.opacity = ledPulse;
      ledOverlay.style.boxShadow = `0 0 ${4+ledPulse*5}px #00ff00`;
    } else {
      intercomImg.style.transform = 'translate(0,0)';
      ledOverlay.style.opacity = '0.08';
      ledOverlay.style.boxShadow = '0 0 3px #00aa00';
    }
  }

  svgWrap.addEventListener('click',()=>{
    if(typing) return;
    typeLine(nextLine());
  });

  // =============================================
  //  BACKGROUND CANVAS
  // =============================================
  function draw(){
    cx.clearRect(0,0,W,H);
    cx.fillStyle='#0e0c09'; cx.fillRect(0,0,W,H);
    const cxW=W/2, cyH=H/2;
    const vx=cxW+Math.sin(t*0.08)*22, vy=cyH+Math.cos(t*0.05)*16;

    // corridor lines
    for(let i=0;i<10;i++){
      const p=i/10, spread=p*W*0.65;
      [[cyH+20+(H*0.5-20)*p],[cyH-20-(H*0.5-20)*p]].forEach(([yy])=>{
        cx.beginPath(); cx.moveTo(vx,vy); cx.lineTo(cxW-spread/2,yy);
        cx.strokeStyle=`rgba(42,26,9,${0.07+p*0.09})`; cx.lineWidth=0.4+p*0.4; cx.stroke();
        cx.beginPath(); cx.moveTo(vx,vy); cx.lineTo(cxW+spread/2,yy); cx.stroke();
      });
    }

    // black doors
    [{x:0.12,y:0.22,w:0.09,h:0.38,ph:0},{x:0.80,y:0.26,w:0.08,h:0.34,ph:1.8},{x:0.44,y:0.06,w:0.12,h:0.13,ph:3.2}].forEach(d=>{
      const dx=d.x*W+Math.sin(t*0.14+d.ph)*3;
      const dy=d.y*H+Math.cos(t*0.10+d.ph)*2;
      cx.fillStyle='rgba(3,2,1,.95)'; cx.fillRect(dx,dy,d.w*W,d.h*H);
      cx.strokeStyle=`rgba(55,36,13,.28)`; cx.lineWidth=0.7; cx.strokeRect(dx,dy,d.w*W,d.h*H);
    });

    // bg noise
    if(Math.random()<0.08){
      cx.font=`${6+Math.random()*4}px 'Courier New'`;
      cx.fillStyle=`rgba(${38+Math.random()*25},${23+Math.random()*15},${6+Math.random()*7},.05)`;
      let s=''; const chars='0123456789ABCDEFabcdef_:/\\░▒▓';
      for(let i=0;i<8;i++) s+=chars[Math.floor(Math.random()*chars.length)];
      cx.fillText(s,Math.random()*W,Math.random()*H);
    }

    cx.fillStyle='rgba(120,80,20,.007)';
    cx.fillRect(0,(t*24)%H,W,1);

    const vig=cx.createRadialGradient(cxW,cyH,H*0.06,cxW,cyH,H*0.65);
    vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,.9)');
    cx.fillStyle=vig; cx.fillRect(0,0,W,H);
  }

  // =============================================
  //  RESIZE + LOOP
  // =============================================
  function resize(){
    const nW=window.innerWidth, nH=window.innerHeight;
    if(nW===W && nH===H) return;
    W=nW; H=nH; cv.width=W; cv.height=H;
    if(links.length===0) initLinks();
  }

  function loop(){
    t+=0.016; resize(); draw(); updateLinks(); updatePhone();
    requestAnimationFrame(loop);
  }
  loop();
})();

</script>
</body>
</html>
